name: Build validated dashboard and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 6:30 PM, 8:30 PM, and 10:30 PM India time. Later runs act as
    # completeness retries; identical validated builds are not redeployed.
    - cron: "0 13,15,17 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deployment-check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Restore production input cache
        uses: actions/cache@v4
        with:
          path: data/input
          key: nse-production-input-${{ github.run_id }}
          restore-keys: nse-production-input-
      - name: Refresh production inputs
        run: python scripts/refresh_production_data.py --output data/input --history-days 2200
      - name: Build and validate production dashboard
        run: PYTHONPATH=src python -m india_market_dashboard.cli build --history-dir data/input/history --classification-file data/input/classifications.csv
      - name: Generate deterministic test fixtures
        run: python scripts/generate_demo_data.py
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
      - name: Compare with current live dashboard
        id: deployment-check
        run: python scripts/check_deployment_needed.py
      - name: Enforce release gate and stage site
        if: steps.deployment-check.outputs.deploy == 'true'
        run: PYTHONPATH=src python -m india_market_dashboard.cli publish --destination build
      - if: steps.deployment-check.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.deployment-check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.deploy == 'true'
    steps:
      - name: Deploy validated artifact only
        id: deployment
        uses: actions/deploy-pages@v4
